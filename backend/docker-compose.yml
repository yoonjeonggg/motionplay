services:
  postgres:
    image: postgres:16
    container_name: motionplay-pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: motionplay
    ports:
      - "5433:5432"
    volumes:
      - motionplay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d motionplay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  motionplay-pgdata:
