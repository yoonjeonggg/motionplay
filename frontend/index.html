<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="손동작으로 슬라임 등 다양한 소재를 조몰락거리며 노는 웹 인터랙티브 모션 플레이"
    />
    <title>MotionPlaying</title>
    <script>
      // Resolve the theme before first paint so a reload never flashes the
      // wrong colours. Mirrors src/store/themeStore.ts.
      try {
        var pref = localStorage.getItem('mp.theme')
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
